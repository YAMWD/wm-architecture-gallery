<text x="139.0" y="366.0" font-family="IBM Plex Sans" font-weight="400" font-size="12.0" fill="#1E2A3B" text-anchor="middle">MLP (FFN 1024)</text>
<text x="139.0" y="389.1" font-family="IBM Plex Sans" font-weight="400" font-size="10.5" fill="#5E6B80" text-anchor="middle">KV cache over 24 steps at batch 1024 (K, V</text>
