<text x="153.0" y="199.2" font-family="IBM Plex Sans" font-weight="400" font-size="13.0" fill="#1E2A3B" text-anchor="middle">Next latent: one categorical sample,</text>
<text x="153.0" y="215.5" font-family="IBM Plex Sans" font-weight="400" font-size="13.0" fill="#1E2A3B" text-anchor="middle">32×32</text>
<text x="153.0" y="231.3" font-family="IBM Plex Sans" font-weight="400" font-size="11.5" fill="#5E6B80" text-anchor="middle">1 pass per imagined step; no iterative</text>
<text x="153.0" y="245.7" font-family="IBM Plex Sans" font-weight="400" font-size="11.5" fill="#5E6B80" text-anchor="middle">decoding</text>
